# Hosted BotSpot connection; authorization uses OAuth.
startCommand:
  type: http
  configSchema:
    type: object
    properties: {}
  url: https://mcp.botspot.trade/mcp
  description: >
    Connect your AI assistant to BotSpot to create and edit LumiBot strategies,
    run historical backtests, analyze results and monitor your bots.
    Free to connect; signing in creates a free BotSpot account. Paid plans unlock heavier backtests, live bots and real-money trades. Broker and market-data requirements vary.
